name: Tests

on:
  push:
    branches: [main, himmel-main, "fix/**"]
  pull_request:
    branches: [main, himmel-main]

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run tests
        run: uv run pytest -q
